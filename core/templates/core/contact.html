{% extends 'core/base.html' %}
{% block title %}Contact – LuminaBank{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <h1 class="section-title mb-2">Get in touch</h1>
                <p class="text-muted mb-4">Questions about your account or the platform? We’re here 8 AM – 11 PM ET, 7 days a week.</p>
                
                <div class="dashboard-card mb-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Message</label>
                            <textarea name="message" class="form-control" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>

                <div class="row g-3 text-center">
                    <div class="col-6">
                        <div class="dashboard-card py-3">
                            <i class="bi bi-telephone text-primary fs-4"></i>
                            <div class="small fw-semibold mt-1">1-800-LUMINA</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="dashboard-card py-3">
                            <i class="bi bi-chat-dots text-primary fs-4"></i>
                            <div class="small fw-semibold mt-1">In-app Chat</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
